[project]
name = "ns-hpc"
version = "0.2.1"
description = "HPC sandboxing via bubblewrap — MCP server and CLI tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref>=3.11.1",
    "fastmcp>=3.2.4",
    "pydantic>=2.13.4",
    "tomli>=2.4.1",
    "typer>=0.25.1",
    "wsgidav>=4.3.4",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
ns-hpc = "ns_hpc.cli:app"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

