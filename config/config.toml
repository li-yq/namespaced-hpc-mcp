# ── ns-hpc Configuration ─────────────────────────────────────────────────────
#
# This file serves as a reference.  Uncommented values are the defaults.
# Uncomment and change to override.

# ── Namespace sandbox defaults ───────────────────────────────────────────────
[namespace]
# Directory where sandbox instances are stored.  ${HOME} and ~ are expanded.
# instances_dir = "${HOME}/.local/share/ns-hpc/instances"

# Base command for bwrap sandbox creation.  Additional arguments like
# --bind (workspace), --chdir, --json-status-fd, and `<command>` are
# appended dynamically at runtime.
bwrap_command = [
    "bwrap",
    "--unshare-all", "--share-net",
    "--proc", "/proc", "--dev", "/dev", "--tmpfs", "/tmp",
    "--ro-bind", "/usr", "/usr",
    "--ro-bind", "/lib", "/lib",
    "--ro-bind", "/lib64", "/lib64",
    "--ro-bind", "/bin", "/bin",
    "--ro-bind", "/sbin", "/sbin",
    "--ro-bind", "/etc", "/etc",
]
# Mount point for the per-instance writable workspace (read-write).
# workspace_mount = "/workspace"
# Mount point for the shared (read-only) output exchange across instances.
# shared_output_mount = "/shared-output"
# Mount point for the per-instance output files (read-write).
# output_mount = "/output"
# File descriptor used for bwrap --json-status-fd (job completion tracking).
# status_fd = 3

# ── Job execution ────────────────────────────────────────────────────────────
[jobs]
# Hard limit for any job --timeout value.  Longer timeouts are silently capped
# to this value and a "timeout_capped" flag is returned in the result.
# max_timeout = 3600

# Local (bwrap) execution with optional cgroup limits
[jobs.local]
# use_cgroups = true
# Base command for systemd-run cgroup v2 resource limits.  Inner shell
# command and script arguments are appended dynamically at runtime.
cgroups_command = [
    "systemd-run", "--user", "--scope",
    "-p", "CPUQuota=400%",
    "-p", "MemoryMax=8G",
    "--",
]
# Verify running jobs via /proc after server restart (liveness check).
# proc_check = true

# Slurm batch submission
[jobs.slurm]
# Base command for sbatch submissions.  Flags containing ``{cpus}`` or
# ``{memory}`` are substituted with resolved resource values at runtime.
# Additional arguments (--wrap, --output, --error, --job-name) are
# appended dynamically.
sbatch_command = [
    "sbatch",
    "--partition", "cpu",
    "--cpus-per-task={cpus}",
    "--mem={memory}M",
    # "--gres=gpu:{gpus}",
]
# Resource limits and defaults (integers only).
[jobs.slurm.limit]
cpus = { default = 1, max = 8 }
memory = { default = 4096, max = 32768 }
# gpus = { default = 0, max = 8 }

# ── Proxied MCP servers ──────────────────────────────────────────────────────
# Each entry runs an external MCP server inside the bwrap sandbox.
# The tool is exposed to clients as "{name}__{remote_tool_name}".
#
# [proxied_mcps.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/"]
#
# Pre-installed variant (npm install -g @modelcontextprotocol/server-filesystem):
# [proxied_mcps.filesystem]
# command = "mcp-server-filesystem"
# args = ["/"]
#
# Example: custom MCP server with env vars
# [proxied_mcps.my-custom]
# command = "uvx"
# args = ["my-mcp-server"]
# env = {TOKEN = "sekret"}

# Each proxied MCP can restrict which remote tools are exposed via include/
# exclude glob patterns.  If both are set, a tool must match an include pattern
# AND not match any exclude pattern.  Both default to [] — all tools exposed.
#
# [proxied_mcps.filesystem]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/"]
# include = ["read_*", "list_*"]    # only consider these tools
# exclude = ["*_dangerous"]         # drop matching tools from include result

[proxied_mcps.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/"]
# idle_timeout = 300                # idle seconds before auto-close (0 = live forever)


# ── Context resources ────────────────────────────────────────────────────────
[resource]
# Directories scanned for resource files (relative paths resolve from the
# config file's parent directory; ~ is expanded).
# context_dirs = ["config/context"]
context_dirs = ["context"]
# File patterns matched when registering resources.
# resource_patterns = ["*.md"]

# ── MCP result formatting ────────────────────────────────────────────────────
[mcp]
# Result shape for ns-hpc's own tools: "text", "structured", or "both".
# Proxied MCP tools keep their upstream result formatting.
# result_type = "text"

# ── WebDAV file access ───────────────────────────────────────────────────────
[dav]
# Enable WebDAV file access under /dav/ (only effective with HTTP transports).
# Instance workspaces are served at /dav/instances/{id}/workspace/ and
# /dav/instances/{id}/output/ — both read-write.  Archived instances are
# excluded automatically.
# enabled = false

# Extra static mounts served at /dav/{name}/.  Set ro=false for read-write.
# [dav.extras.external-data]
# path = "/mnt/external-data"
# ro = true
