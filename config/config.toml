[namespace_defaults]
bind_ro = ["/usr", "/lib", "/lib64", "/bin", "/sbin", "/etc"]
workspace_mount = "/workspace"
flags = ["--unshare-all", "--share-net", "--proc", "/proc", "--dev", "/dev", "--tmpfs", "/tmp"]

[proxied_mcps]

[resource_defaults]
context_dirs = ["context"]
resource_patterns = ["*.md"]

[slurm]
partition = "cpu"
default_cpus = 1
default_memory_gb = 4
default_timeout = 3600

[resource_limits]
local_timeout = 300
slurm_timeout = 86400
